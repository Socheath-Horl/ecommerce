<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Page not found — Horizon Supply Co.</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ui.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/tokens.css" />
  <script src="assets/tailwind.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);})()"></script>
  <script src="assets/tailwind.config.js"></script>
  <script>
(function (d) {
  var q = [], pumped = false;
  var fake = function (o) { q.push(o || {}); };
  var L = window.lucide = window.lucide || {};
  if (!L.createIcons) L.createIcons = fake;
  function pump() {
    var now = window.lucide;
    if (!now || !now.createIcons || now.createIcons === fake || pumped) return;
    pumped = true;
    for (var i = 0; i < q.length; i++) { try { now.createIcons(q[i]); } catch (e) {} }
    q = [];
  }
  function load(src) {
    var s = d.createElement('script');
    s.src = src;
    s.onload = pump;
    s.onerror = function () {
      if (src.indexOf('assets/') === 0) load('https://unpkg.com/lucide@latest');
      else pump();
    };
    d.head.appendChild(s);
  }
  load('assets/lucide.min.js');
  var iv = setInterval(function () { pump(); if (pumped) clearInterval(iv); }, 300);
})(document);
  </script>
</head>
<body class="grid min-h-screen place-items-center bg-background font-sans text-foreground antialiased">
  <main class="w-full max-w-[440px] px-8 text-center" data-od-id="not-found">
    <p class="font-serif text-[clamp(96px,20vw,168px)] font-semibold leading-none tracking-[-0.02em]" style="background:linear-gradient(160deg,var(--primary),color-mix(in oklch,var(--primary) 45%,var(--muted-foreground)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent" aria-hidden="true">404</p>
    <h1 class="mt-5 mb-1 font-serif text-[26px] tracking-[-0.01em]">Page not found</h1>
    <p class="m-0 text-[15px] text-muted-foreground">The route you tried doesn't exist on this prototype.</p>
    <a class="mt-8 inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-5 text-[15px] font-medium tracking-tight text-primary-foreground transition-colors hover:bg-primary/90 active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" href="home-page.html"><i data-lucide="arrow-right" class="size-[18px] rotate-180"></i> Back to Home</a>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
