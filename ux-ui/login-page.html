<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horizon Supply Co. · Sign in</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ui.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/tokens.css" />
  <script src="assets/tailwind.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);})()"></script>
  <script src="assets/tailwind.config.js"></script>
  <script>
(function (d) {
  var q = [], pumped = false;
  var fake = function (o) { q.push(o || {}); };
  var L = window.lucide = window.lucide || {};
  if (!L.createIcons) L.createIcons = fake;
  function pump() {
    var now = window.lucide;
    if (!now || !now.createIcons || now.createIcons === fake || pumped) return;
    pumped = true;
    for (var i = 0; i < q.length; i++) { try { now.createIcons(q[i]); } catch (e) {} }
    q = [];
  }
  function load(src) {
    var s = d.createElement('script');
    s.src = src;
    s.onload = pump;
    s.onerror = function () {
      if (src.indexOf('assets/') === 0) load('https://unpkg.com/lucide@latest');
      else pump();
    };
    d.head.appendChild(s);
  }
  load('assets/lucide.min.js');
  var iv = setInterval(function () { pump(); if (pumped) clearInterval(iv); }, 300);
})(document);
  </script>
</head>
<body class="flex min-h-screen flex-col bg-background font-sans text-foreground antialiased">

  <!-- AUTH FRAME (minimal — §5.1 wireframe shows logo + centered card) -->
  <header class="border-b border-border bg-background/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-[1280px] items-center justify-between gap-4 px-8 py-[13px]">
      <a class="font-serif text-[19px] font-semibold -tracking-[0.01em] text-foreground" href="home-page.html" data-od-id="logo" aria-label="Horizon Supply Co. — home">Horizon Supply Co.</a>
      <div class="flex items-center gap-2.5">
        <button class="theme-toggle inline-grid size-11 place-items-center rounded-md border border-border bg-transparent text-foreground transition-colors hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" type="button" id="theme-toggle" aria-label="Toggle light and dark theme">
          <i data-lucide="sun" class="size-[18px] dark:hidden"></i>
          <i data-lucide="moon" class="hidden size-[18px] dark:block"></i>
        </button>
        <a class="inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md bg-transparent px-2 text-[15px] font-medium tracking-tight text-foreground transition-colors hover:bg-muted active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" href="home-page.html">Back to store</a>
      </div>
    </div>
  </header>

  <main class="grid flex-1 place-items-center px-5 pt-14 pb-[72px]" data-od-id="auth-login">
    <form class="flex w-full max-w-[400px] flex-col gap-[18px] rounded-lg border border-border bg-card p-8 shadow-soft" id="login-form" novalidate data-od-id="login-form">
      <p class="m-0 font-mono text-[11px] uppercase tracking-[0.08em] text-primary">Account</p>
      <h1 class="m-0 font-serif text-[26px] -tracking-[0.01em]">Sign in</h1>
      <p class="m-0 -mt-2 text-sm text-muted-foreground">Welcome back — your cart and orders are waiting.</p>

      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-[13px] font-medium">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com"
               aria-invalid="false"
               class="flex h-11 w-full rounded-md border border-input bg-card px-3 text-sm text-foreground transition-colors placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 aria-invalid:border-destructive" />
        <span class="min-h-4 text-xs text-destructive" id="err-email"></span>
      </div>
      <div class="flex flex-col gap-1.5" data-od-id="password-field">
        <label for="password" class="text-[13px] font-medium">Password</label>
        <div class="password-wrap relative flex h-11 items-center rounded-md border border-input bg-card transition-colors focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/15 aria-invalid:border-destructive" id="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
                 aria-invalid="false" aria-describedby="pw-toggle"
                 class="h-auto min-w-0 flex-1 bg-transparent px-3 text-sm text-foreground outline-none pr-12 placeholder:text-muted-foreground" />
          <button class="toggle absolute right-0.5 top-0 grid size-11 place-items-center border-0 bg-transparent text-muted-foreground transition-colors hover:text-foreground" type="button" id="pw-toggle" aria-pressed="false" aria-label="Show password">
            <i data-lucide="eye" id="pw-eye" class="size-[18px]"></i>
            <i data-lucide="eye-off" id="pw-eye-off" class="hidden size-[18px]"></i>
          </button>
        </div>
        <span class="min-h-4 text-xs text-destructive" id="err-password"></span>
      </div>

      <button class="inline-flex h-14 w-full items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary px-7 py-3.5 text-base font-medium tracking-tight text-primary-foreground transition-colors hover:bg-primary/90 active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-45" type="submit" id="submit-btn">Sign in</button>

      <div class="flex flex-wrap items-center justify-center gap-1.5 border-t border-border pt-4 text-sm text-muted-foreground">
        <span>No account?</span>
        <a class="font-semibold text-foreground underline-offset-[3px] hover:underline" href="register-page.html">Create one</a>
      </div>
    </form>
  </main>

  <footer class="border-t border-border py-6 text-center" data-od-id="auth-footer">
    <span class="font-mono text-xs text-muted-foreground">Horizon Supply Co. © 2026</span>
  </footer>

  <div class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-full max-w-[min(360px,calc(100vw_-_32px))] flex-col gap-2.5" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script>
    (function () {
      /* ─── theme ─────────────────────────────────────────────────────── */
      var themeBtn = document.querySelector('.theme-toggle');
      function applyTheme() {
        var dark = document.documentElement.classList.contains('dark');
        themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      themeBtn.addEventListener('click', function () {
        var dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('ui.theme', dark ? 'dark' : 'light'); } catch (e) {}
        applyTheme();
      });
      applyTheme();

      /* ─── toasts ────────────────────────────────────────────────────── */
      var toastStack = document.getElementById('toast-stack');
      function toast(type, title, msg) {
        var isSuccess = type === 'success', isError = type === 'error';
        var el = document.createElement('div');
        el.className = 'flex items-start gap-3 rounded-lg border border-border bg-card p-3 shadow-soft ' +
          (isSuccess ? 'toast--success' : isError ? 'toast--error' : 'toast--info');
        el.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        var icon = document.createElement('span');
        icon.className = 'flex size-5 shrink-0 items-center justify-center rounded-full font-mono text-xs font-semibold ' +
          (isSuccess
            ? 'bg-chart-1/15 text-[color-mix(in_oklch,var(--chart-1)_45%,var(--foreground))]'
            : isError
              ? 'bg-destructive/15 text-[color-mix(in_oklch,var(--destructive)_60%,var(--foreground))]'
              : 'bg-chart-3/15 text-[color-mix(in_oklch,var(--chart-3)_50%,var(--foreground))]');
        icon.textContent = isSuccess ? '✓' : isError ? '!' : 'i';
        el.setAttribute('role', isError ? 'alert' : 'status');
        var body = document.createElement('span');
        body.className = 'block min-w-0';
        var t = document.createElement('span');
        t.className = 'block text-sm font-semibold text-foreground';
        t.textContent = title;
        var m = document.createElement('span');
        m.className = 'mt-0.5 block text-[13px] text-muted-foreground';
        m.textContent = msg;
        body.appendChild(t); body.appendChild(m);
        el.appendChild(icon); el.appendChild(body);
        toastStack.appendChild(el);
        setTimeout(function () {
          el.style.opacity = '0'; el.style.transform = 'translateY(4px)';
          setTimeout(function () { el.remove(); }, 220);
        }, 3400);
      }

      var nextTarget = (function () {
        var raw = new URLSearchParams(window.location.search).get('next');
        if (!raw) return 'home-page.html';
        if (/\.html/.test(raw)) return raw;
        if (raw.indexOf('/products/') === 0) return 'product-detail.html?id=' + raw.slice('/products/'.length).split('?')[0];
        if (raw.indexOf('/orders/') === 0) return 'order-detail-page.html?id=' + raw.slice('/orders/'.length).split('?')[0];
        var routes = {
          '/': 'home-page.html', '/products': 'products-page.html', '/cart': 'cart-page.html',
          '/checkout': 'checkout-page.html', '/order/success': 'order-success.html',
          '/orders': 'orders-page.html', '/profile': 'profile-page.html', '/admin': 'admin-page.html'
        };
        for (var k in routes) if (raw === k || raw.indexOf(k + '?') === 0) return routes[k] + raw.slice(k.length);
        return 'home-page.html';
      })();

      /* ─── guard: redirect away if authed (GUEST route, §7 matrix) ──── */
      try {
        if (localStorage.getItem('ui.token')) {
          window.location.href = nextTarget;
          return;
        }
      } catch (e) {}

      /* ─── show/hide password (§5.1 — replaces a dead "Forgot?") ─────── */
      var pwToggle = document.getElementById('pw-toggle');
      var pw = document.getElementById('password');
      var eyeOn = document.getElementById('pw-eye');
      var eyeOff = document.getElementById('pw-eye-off');
      pwToggle.addEventListener('click', function () {
        var show = pwToggle.getAttribute('aria-pressed') !== 'true';
        pw.type = show ? 'text' : 'password';
        pwToggle.setAttribute('aria-pressed', String(show));
        pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        eyeOn.classList.toggle('hidden', show);
        eyeOff.classList.toggle('hidden', !show);
      });

      /* ─── login submit (simulated POST /api/auth/login) ─────────────── */
      var form = document.getElementById('login-form');
      var emailEl = document.getElementById('email');
      var submitBtn = document.getElementById('submit-btn');

      function setErr(el, id, msg) {
        el.setAttribute('aria-invalid', String(!!msg));
        document.getElementById(id).textContent = msg || '';
      }
      function globalErr(el, id, msg) {
        el.setAttribute('aria-invalid', String(!!msg));
        var err = document.getElementById(id);
        if (err) err.textContent = msg || '';
      }

      [emailEl, pw].forEach(function (el) {
        el.addEventListener('input', function () {
          if (el === emailEl) globalErr(el, 'err-email', '');
          else globalErr(el, 'err-password', '');
          pw.parentElement.setAttribute('aria-invalid', String(el === pw && el.getAttribute('aria-invalid') === 'true'));
        });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = emailEl.value.trim();
        var pass = pw.value;
        var ok = true;

        globalErr(emailEl, 'err-email', !email ? 'Email is required.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Enter a valid email address.' : '');
        if (emailEl.getAttribute('aria-invalid') === 'true') ok = false;
        globalErr(pw, 'err-password', !pass ? 'Password is required.' : '');
        pw.parentElement.setAttribute('aria-invalid', String(pw.getAttribute('aria-invalid') === 'true'));
        if (pw.getAttribute('aria-invalid') === 'true') ok = false;
        if (!ok) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="size-4 animate-spin rounded-full border-2 border-primary-foreground/45 border-t-primary-foreground"></span> Signing in…';

        setTimeout(function () {
          /* Demo API: password length < 6 → 401 (real: POST /api/auth/login) */
          if (pass.length < 6) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
            globalErr(pw, 'err-password', 'Invalid email or password.');
            pw.parentElement.setAttribute('aria-invalid', 'true');
            toast('error', '401 · Invalid email or password', 'Check your credentials and try again.');
            return;
          }
          try {
            localStorage.setItem('ui.token', 'demo-token-' + Date.now());
            localStorage.setItem('ui.user', JSON.stringify({ name: email.split('@')[0], email: email }));
          } catch (err) {}
          toast('success', 'Welcome back', 'Signed in as ' + email);
          setTimeout(function () { window.location.href = nextTarget; }, 700);
        }, 850);
      });
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
