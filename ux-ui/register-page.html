<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horizon Supply Co. · Create account</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ui.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <style>
    /* ─── tokens ─────────────────────────────────────────────────────────
       Identical values to brand-spec.md (source of truth). Selector is
       html.dark to match shadcn/ui's `darkMode: ['class']` strategy.
       Reference hexes: light fg #09090B · bg #FFFFFF · border #E4E4E7 ·
       muted #71717A · accent/dark-fg #FAFAFA · dark bg #09090B ·
       dark surface #18181B · dark border #27272A. */
    :root {
      --bg:      oklch(1 0 89.9);
      --surface: oklch(1 0 89.9);
      --fg:      oklch(0.1408 0.0044 285.8);
      --muted:   oklch(0.5517 0.0138 285.9);
      --border:  oklch(0.9197 0.004 286.3);
      --accent:  oklch(0.2103 0.0059 285.9);

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
      --shadow-soft: 0 1px 2px color-mix(in oklch, var(--fg) 8%, transparent),
                     0 16px 40px -18px color-mix(in oklch, var(--fg) 14%, transparent);
      --on-accent:  oklch(0.9851 0 89.9);
      --hover-fill: oklch(0.9674 0.0013 286.4);
      --success:     oklch(0.6271 0.1699 149.2);
      --warning:     oklch(0.6806 0.1423 75.8);
      --info:        oklch(0.5461 0.2152 262.9);
      --destructive: oklch(0.5771 0.2152 27.3);
      --success-soft:     color-mix(in oklch, var(--success) 14%, transparent);
      --warning-soft:     color-mix(in oklch, var(--warning) 14%, transparent);
      --info-soft:        color-mix(in oklch, var(--info) 14%, transparent);
      --destructive-soft: color-mix(in oklch, var(--destructive) 14%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --container: 1280px;
      --gutter: 32px;
      --radius: 10px;
      --radius-lg: 16px;

      color-scheme: light;
    }

    .dark {
      --bg:      oklch(0.1408 0.0044 285.8);
      --surface: oklch(0.2103 0.0059 285.9);
      --fg:      oklch(0.9851 0 89.9);
      --muted:   oklch(0.7118 0.0129 286.1);
      --border:  oklch(0.2739 0.0055 286);
      --accent:  oklch(0.9851 0 89.9);
      --on-accent:  oklch(0.2103 0.0059 285.9);
      --hover-fill: oklch(0.2103 0.0059 285.9);
      --success:     oklch(0.7227 0.192 149.6);
      --warning:     oklch(0.8606 0.1731 91.9);
      --info:        oklch(0.6231 0.188 259.8);
      --destructive: oklch(0.6368 0.2078 25.3);
      color-scheme: dark;
    }

    /* ─── reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    /* ─── auth frame (minimal, §5.1/§5.2) ────────────────────────────── */
    .auth-top {
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }
    .auth-top-inner {
      max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter);
      padding-block: 13px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .auth-top .logo {
      font-family: var(--font-display); font-size: 19px; font-weight: 600;
      letter-spacing: -0.01em; color: var(--fg);
    }
    .auth-top .cluster { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { display: inline-flex; align-items: center; gap: 8px; }
    .theme-toggle .theme-icon { display: grid; place-items: center; }
    .theme-toggle .moon { display: none; }
    html.dark .theme-toggle .sun  { display: none; }
    html.dark .theme-toggle .moon { display: block; }

    /* ─── button (shadcn anatomy) ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.4;
      white-space: nowrap;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn[data-variant="default"]     { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .btn[data-variant="default"]:hover { background: color-mix(in oklch, var(--accent) 86%, black); }
    .btn[data-variant="secondary"]   { background: var(--hover-fill); color: var(--fg); }
    .btn[data-variant="secondary"]:hover { background: color-mix(in oklch, var(--hover-fill) 88%, var(--fg)); }
    .btn[data-variant="outline"]     { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn[data-variant="outline"]:hover { background: var(--hover-fill); border-color: var(--fg); }
    .btn[data-variant="ghost"]       { background: transparent; color: var(--fg); padding-inline: 8px; }
    .btn[data-variant="ghost"]:hover { background: var(--hover-fill); }
    .btn[data-variant="link"]        { background: transparent; color: var(--fg); padding: 0; text-decoration: underline; text-underline-offset: 4px; }
    .btn[data-size="lg"]  { padding: 14px 28px; font-size: 16px; }
    .btn--block { width: 100%; justify-content: center; }
    .icon-btn {
      width: 44px; height: 44px;
      display: inline-grid; place-items: center;
      border: 1px solid transparent; border-radius: 999px;
      background: transparent; color: var(--fg);
    }
    .icon-btn:hover { background: var(--hover-fill); }
    .icon-btn--bordered { border-color: var(--border); border-radius: var(--radius); }
    .icon-btn svg { width: 18px; height: 18px; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .btn .btn-spinner {
      width: 16px; height: 16px; flex: none;
      border: 2px solid color-mix(in oklch, var(--on-accent) 45%, transparent);
      border-top-color: var(--on-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── form field ────────────────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; }
    .field .req { color: var(--destructive); }
    .field input {
      height: 44px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--fg);
      font: inherit; font-size: 14px;
      padding: 0 12px;
      transition: border-color 0.15s ease;
    }
    .field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }
    .field .hint { font-size: 12px; color: var(--muted); }
    .field input[aria-invalid="true"] { border-color: var(--destructive); }
    .field .err { font-size: 12px; color: var(--destructive); min-height: 16px; }
    .password-wrap {
      position: relative;
      display: flex; align-items: center;
      height: 44px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 0.15s ease;
    }
    .password-wrap:focus-within { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .password-wrap input {
      flex: 1; min-width: 0;
      height: auto; border: 0; background: transparent;
      padding-right: 44px;
    }
    .password-wrap input:focus { outline: none; }
    .password-wrap .toggle {
      position: absolute; right: 2px; top: 0;
      width: 40px; height: 44px;
      border: 0; background: transparent; color: var(--muted);
      display: grid; place-items: center;
    }
    .password-wrap .toggle:hover { color: var(--fg); }
    .password-wrap[aria-invalid="true"] { border-color: var(--destructive); }
    .password-wrap .toggle svg { width: 18px; height: 18px; }
    .password-wrap .toggle .eye-off { display: none; }
    .password-wrap .toggle[aria-pressed="true"] .eye { display: none; }
    .password-wrap .toggle[aria-pressed="true"] .eye-off { display: block; }

    /* ─── centered auth card (§5.2, max-w 400px, same layout as login) ─ */
    .auth-body {
      flex: 1;
      display: grid; place-items: center;
      padding: 56px 20px 72px;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface); box-shadow: var(--shadow-soft);
      padding: 32px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .auth-card .eyebrow {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent); margin: 0;
    }
    .auth-card h1 { font-family: var(--font-display); font-size: 26px; letter-spacing: -0.01em; margin: 0; }
    .auth-card p.sub { color: var(--muted); font-size: 14px; margin: -8px 0 0; }
    .auth-foot {
      border-top: 1px solid var(--border); padding-top: 16px;
      text-align: center; font-size: 14px; color: var(--muted);
      display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    }
    .auth-foot a { font-weight: 600; color: var(--fg); }
    .auth-foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

    .auth-footer {
      padding-block: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    /* ─── toasts (sonner anatomy) ───────────────────────────────────── */
    .toast-stack {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      display: flex; flex-direction: column; gap: 10px;
      max-width: min(360px, calc(100vw - 32px));
      width: 100%;
    }
    .toast {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .toast--out { opacity: 0; transform: translateY(4px); transition: opacity 0.2s ease, transform 0.2s ease; }
    .toast-icon {
      width: 20px; height: 20px; flex: none; border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    }
    .toast--success .toast-icon { background: var(--success-soft); color: color-mix(in oklch, var(--success) 45%, var(--fg)); }
    .toast--info    .toast-icon { background: var(--info-soft);    color: color-mix(in oklch, var(--info) 50%, var(--fg)); }
    .toast--error   .toast-icon { background: var(--destructive-soft); color: color-mix(in oklch, var(--destructive) 60%, var(--fg)); }
    .toast-body { display: block; }
    .toast-title { display: block; font-size: 14px; font-weight: 600; }
    .toast-msg { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  </style>
</head>
<body>
  <!-- AUTH FRAME (minimal — §5.2, same layout as Login) -->
  <div class="auth-top" data-od-id="auth-top">
    <div class="auth-top-inner">
      <a class="logo" href="home-page.html" data-od-id="logo" aria-label="Horizon Supply Co. — home">Horizon Supply Co.</a>
      <div class="cluster">
        <button class="icon-btn icon-btn--bordered theme-toggle" type="button" id="theme-toggle" aria-label="Toggle light and dark theme">
          <span class="theme-icon">
            <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </span>
        </button>
        <a class="btn" data-variant="ghost" href="home-page.html">Back to store</a>
      </div>
    </div>
  </div>

  <main class="auth-body" data-od-id="auth-register">
    <form class="auth-card" id="reg-form" novalidate data-od-id="register-form">
      <p class="eyebrow">Account</p>
      <h1>Create account</h1>
      <p class="sub">One account for orders, addresses, and reviews.</p>

      <div class="field">
        <label for="name">Name <span class="req">*</span></label>
        <input id="name" type="text" autocomplete="name" placeholder="Jane Doe" aria-invalid="false" />
        <span class="err" id="err-name"></span>
      </div>
      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-invalid="false" />
        <span class="err" id="err-email"></span>
      </div>
      <div class="field" data-od-id="password-field">
        <label for="password">Password <span class="req">*</span></label>
        <div class="password-wrap" id="pw-wrap">
          <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="••••••••" aria-invalid="false" aria-describedby="pw-toggle pw-hint" />
          <button class="toggle" type="button" id="pw-toggle" aria-pressed="false" aria-label="Show password">
            <span class="eye" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
            <span class="eye-off" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l16 16M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-3.2 4.4M6.6 6.6C3.9 8.3 2 12 2 12s3.5 8 10 8a9.5 9.5 0 0 0 4.1-.9"/></svg></span>
          </button>
        </div>
        <span class="hint" id="pw-hint">min 6 characters</span>
        <span class="err" id="err-password"></span>
      </div>

      <button class="btn btn--block" data-variant="default" data-size="lg" type="submit" id="submit-btn">Create account</button>

      <div class="auth-foot">
        <span>Already have an account?</span>
        <a href="login-page.html">Sign in →</a>
      </div>
    </form>
  </main>

  <footer class="auth-footer" data-od-id="auth-footer">
    <span class="meta" style="font-family: var(--font-mono); font-size: 12px; color: var(--muted);">Horizon Supply Co. © 2026</span>
  </footer>

  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script>
    (function () {
      /* ─── theme ─────────────────────────────────────────────────────── */
      var themeBtn = document.querySelector('.theme-toggle');
      function applyTheme() {
        var dark = document.documentElement.classList.contains('dark');
        themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      themeBtn.addEventListener('click', function () {
        var dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('ui.theme', dark ? 'dark' : 'light'); } catch (e) {}
        applyTheme();
      });
      applyTheme();

      /* ─── toasts ────────────────────────────────────────────────────── */
      var toastStack = document.getElementById('toast-stack');
      function toast(type, title, msg) {
        var el = document.createElement('div');
        el.className = 'toast toast--' + (type === '' ? 'info' : type);
        var icon = document.createElement('span');
        icon.className = 'toast-icon';
        icon.textContent = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
        el.setAttribute('role', type === 'error' ? 'alert' : 'status');
        var body = document.createElement('span');
        body.className = 'toast-body';
        var t = document.createElement('span');
        t.className = 'toast-title';
        t.textContent = title;
        var m = document.createElement('span');
        m.className = 'toast-msg';
        m.textContent = msg;
        body.appendChild(t); body.appendChild(m);
        el.appendChild(icon); el.appendChild(body);
        toastStack.appendChild(el);
        setTimeout(function () {
          el.classList.add('toast--out');
          setTimeout(function () { el.remove(); }, 220);
        }, 3400);
      }

      var nextTarget = (function () {
        var raw = new URLSearchParams(window.location.search).get('next');
        if (!raw) return 'home-page.html';
        if (/\.html/.test(raw)) return raw;
        if (raw.indexOf('/products/') === 0) return 'product-detail.html?id=' + raw.slice('/products/'.length).split('?')[0];
        if (raw.indexOf('/orders/') === 0) return 'order-detail-page.html?id=' + raw.slice('/orders/'.length).split('?')[0];
        var routes = {
          '/': 'home-page.html', '/products': 'products-page.html', '/cart': 'cart-page.html',
          '/checkout': 'checkout-page.html', '/order/success': 'order-success.html',
          '/orders': 'orders-page.html', '/profile': 'profile-page.html', '/admin': 'admin-page.html'
        };
        for (var k in routes) if (raw === k || raw.indexOf(k + '?') === 0) return routes[k] + raw.slice(k.length);
        return 'home-page.html';
      })();

      /* ─── guard: redirect away if authed (GUEST route, §7 matrix) ──── */
      try {
        if (localStorage.getItem('ui.token')) {
          window.location.href = nextTarget;
          return;
        }
      } catch (e) {}

      /* ─── show/hide password ────────────────────────────────────────── */
      var pwToggle = document.getElementById('pw-toggle');
      var pw = document.getElementById('password');
      pwToggle.addEventListener('click', function () {
        var show = pwToggle.getAttribute('aria-pressed') !== 'true';
        pw.type = show ? 'text' : 'password';
        pwToggle.setAttribute('aria-pressed', String(show));
        pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });

      /* ─── register submit (simulated POST /api/auth/register) ───────── */
      var form = document.getElementById('reg-form');
      var nameEl = document.getElementById('name');
      var emailEl = document.getElementById('email');
      var submitBtn = document.getElementById('submit-btn');

      function err(el, id, msg) {
        el.setAttribute('aria-invalid', String(!!msg));
        document.getElementById(id).textContent = msg || '';
      }
      [nameEl, emailEl, pw].forEach(function (el) {
        el.addEventListener('input', function () {
          if (el === nameEl) err(el, 'err-name', '');
          else if (el === emailEl) err(el, 'err-email', '');
          else { err(el, 'err-password', ''); el.parentElement.setAttribute('aria-invalid', 'false'); }
        });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = nameEl.value.trim();
        var email = emailEl.value.trim().toLowerCase();
        var pass = pw.value;
        var ok = true;

        err(nameEl, 'err-name', name ? '' : 'Name is required.');
        if (!name) ok = false;
        err(emailEl, 'err-email', !email ? 'Email is required.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Enter a valid email address.' : '');
        if (emailEl.getAttribute('aria-invalid') === 'true') ok = false;
        err(pw, 'err-password', !pass ? 'Password is required.' : pass.length < 6 ? 'Password must be at least 6 characters.' : '');
        pw.parentElement.setAttribute('aria-invalid', String(pw.getAttribute('aria-invalid') === 'true'));
        if (pw.getAttribute('aria-invalid') === 'true') ok = false;
        if (!ok) {
          toast('error', 'Validation error', 'Fix the fields highlighted below.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Creating account…';

        setTimeout(function () {
          /* Demo API: take the reserved address to demo the 409 path
             (real: POST /api/auth/register → 409 Email already exists). */
          if (email === 'jane@horizon.supply') {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create account';
            err(emailEl, 'err-email', 'Email already exists.');
            toast('error', '409 · Email already exists', 'Try signing in instead, or use another email.');
            return;
          }
          try {
            localStorage.setItem('ui.token', 'demo-token-' + Date.now());
            localStorage.setItem('ui.user', JSON.stringify({ name: name, email: email }));
          } catch (err2) {}
          toast('success', 'Account created', 'Welcome, ' + name + ' — you are signed in.');
          setTimeout(function () { window.location.href = nextTarget; }, 700);
        }, 850);
      });
    })();
  </script>
</body>
</html>
